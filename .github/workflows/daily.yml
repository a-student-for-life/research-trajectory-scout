name: Daily Research Scout

on:
  # Run daily at 09:00 IST (03:30 UTC)
  schedule:
    - cron: "30 3 * * *"

  # Allow manual trigger from the Actions tab (useful for testing)
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the report back to the repo

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Cache pip packages ────────────────────────────────────────────────
      # Rebuilding the pip environment every run wastes ~3 minutes.
      # This cache key invalidates whenever requirements.txt changes.
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Cache sentence-transformers model ─────────────────────────────────
      # The all-MiniLM-L6-v2 model (~80 MB) is downloaded on first run
      # and cached here. Subsequent runs skip the download entirely.
      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-minilm-v6-v2
          # No restore-keys needed — this model never changes

      # ── 5. Install dependencies ──────────────────────────────────────────────
      # Install CPU-only torch first (saves ~600 MB vs the default CUDA build).
      # Then install everything else from requirements.txt.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # ── 6. Run the scout ─────────────────────────────────────────────────────
      - name: Run research scout
        env:
          # Optional — get a free key at semanticscholar.org.
          # Without it the agent still works but at 1 req/s (vs 10 req/s).
          # To add this: repo → Settings → Secrets → Actions → New secret
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python agent.py

      # ── 7. Commit report ─────────────────────────────────────────────────────
      # Commits reports/YYYY-MM-DD.md and data/seen_papers.json back to main.
      # If nothing changed (e.g. no new papers today), the step silently exits.
      - name: Commit report to repository
        run: |
          git config --global user.name  "research-scout-bot"
          git config --global user.email "research-scout-bot@users.noreply.github.com"
          git add reports/ data/seen_papers.json
          git commit -m "Scout report $(date -u +%Y-%m-%d)" || echo "Nothing to commit — no new papers today."
          git push
